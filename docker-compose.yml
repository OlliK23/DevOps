services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: backend:3.0
    restart: unless-stopped
    volumes:
      - ../data:/app/data
    networks:
      - app-network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: frontend:3.0
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge